name: alphaguard
description: AlphaGuard AI — family safety (Flutter client). Consumes the existing AlphaGuard V2 backend (REST + Socket.IO).
publish_to: "none"
version: 2.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0" # Color.withValues + TextScaler.clamp

dependencies:
  flutter:
    sdk: flutter

  # Networking (REST)
  dio: ^5.7.0

  # Realtime
  socket_io_client: ^3.0.2

  # Secure JWT persistence + lightweight flags
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # State management
  provider: ^6.1.2

  # Routing (declarative, supports auth/lifecycle redirects)
  go_router: ^14.2.7

  # Auth
  google_sign_in: ^6.2.1
  # sign_in_with_apple removed: v6.x pulls in the objective_c native-assets
  # package which invokes dartaotruntime.exe at Android build time — blocked by
  # Windows Application Control on this build machine. Apple Sign-In is
  # iOS-only and not needed for the Android APK.

  # Media (photo-proof capture; compresses on capture so data-URLs stay small)
  image_picker: ^1.1.2

  # Push notifications (Phase 4A). Needs a Firebase project + platform config
  # (google-services.json / GoogleService-Info.plist) at build time.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # Location + maps (Phase 4B–4D). flutter_map uses OpenStreetMap tiles (no API key).
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # SVG rendering (exact lucide icon paths — Brand mark + hero illustrations)
  flutter_svg: ^2.0.10

  # QR code generation (parent pairing screen — displays code as scannable QR)
  qr_flutter: ^4.1.0

  # QR code scanning (child pairing screen — scan parent's QR with camera)
  mobile_scanner: ^6.0.0

  # Misc
  cupertino_icons: ^1.0.8

dependency_overrides:
  # path_provider_foundation 2.6.0 replaced its Pigeon/plugin implementation
  # with direct Objective-C FFI calls, pulling in the `objective_c` package.
  # `objective_c` has a hook/build.dart that invokes dartaotruntime.exe even
  # for Android builds (to reach its "if not iOS/macOS, return" early exit).
  # dartaotruntime.exe is blocked by Windows Application Control on this
  # build machine.
  #
  # Version 2.5.1 explicitly reverts to the plugin-based implementation
  # ("Reverts to plugin-based implementation while FFI issues are
  # investigated") and has no objective_c dependency. It satisfies
  # path_provider's ^2.3.2 constraint and is fully API-compatible.
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
