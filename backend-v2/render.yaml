# Render blueprint for AlphaGuard V2 realtime backend (Express + Socket.IO + PostgreSQL).
# Deploy from this blueprint with Root Directory = backend-v2.
# Migrations run automatically on boot (initDB -> pg.migrate); no separate step needed.
services:
  - type: web
    name: alphaguard-backend-v2
    runtime: node
    plan: free            # free web services sleep when idle; upgrade to 'starter' for always-on realtime
    rootDir: backend-v2
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # PORT is injected by Render; server reads process.env.PORT (falls back to 4000 locally).
      - key: DATABASE_URL
        fromDatabase:
          name: alphaguard-postgres
          property: connectionString
      - key: PGSSL
        value: "1"          # Render Postgres requires SSL
      - key: AG_JWT_SECRET
        generateValue: true # Render generates a strong secret once and keeps it stable
      # Google OAuth (authorization-code popup flow). Set the actual values in the
      # Render dashboard — they are secret and must not be committed.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Platform support administrators (comma-separated emails). These parent
      # accounts gain access to /admin/support and the admin dashboard.
      - key: AG_ADMIN_EMAILS
        sync: false
      # CORS is currently open ('*') in code. To lock it to the frontend origin later,
      # set this and tighten server.js (see env documentation / future phase).
      # - key: FRONTEND_URL
      #   sync: false

databases:
  - name: alphaguard-postgres
    plan: free              # free Postgres expires after 90 days; upgrade before production
    databaseName: alphaguard
    ipAllowList: []         # only accessible from Render services
